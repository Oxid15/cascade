[build-system]
requires = ["setuptools>=18.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F"]
exclude = [".git", "__pycache__", "build"]

[tool.ruff.lint.per-file-ignores]
"cascade/tests/**/*.py" = ["E402"] # tests use different imports
"cascade/utils/tests/**/*.py" = ["E402"]
"cascade/docs/source/tutorials/*.py" = [
    "E402",
] # tutorials are built as long interactive scripts
"cascade/docs/source/howtos/*.py" = ["E402"]
"cascade/docs/source/howtos/*.ipynb" = ["E402"]
"cascade/docs/source/modules/*.py" = ["E402"]
